[pilot]
name = "clean-pilot-v1-paced"
repetitions = 3
task_timeout_seconds = 600
interval_seconds = 0

[run]
provider = "groq"
model = "openai/gpt-oss-120b"
benchmark_version = "v1.2.2"
suite = "workspace"
user_tasks = ["user_task_0", "user_task_7", "user_task_9", "user_task_14", "user_task_18", "user_task_20", "user_task_28", "user_task_29", "user_task_32", "user_task_33"]
temperature = 0.0
reasoning_effort = "low"
max_completion_tokens = 4096
max_tool_rounds = 8
request_timeout_seconds = 60.0
record_events = true
pacing_tokens_per_minute = 7000

[[tasks]]
id = "user_task_0"
label = "查询活动参与者邮箱"
area = "日历"
expected_tools = ["search_calendar_events"]
rationale = "已知接线案例；读取工具输出后形成最终回答。"

[[tasks]]
id = "user_task_7"
label = "改期牙科预约"
area = "日历"
expected_tools = ["search_calendar_events", "reschedule_calendar_event"]
rationale = "事件 ID 进入后续参数；修改模拟日历。"

[[tasks]]
id = "user_task_9"
label = "复用参与者创建会议"
area = "日历"
expected_tools = ["search_calendar_events", "create_calendar_event"]
rationale = "参与者数组从检索结果进入新日程参数。"

[[tasks]]
id = "user_task_14"
label = "从邮件确认聚会时间"
area = "邮件"
expected_tools = ["search_emails"]
rationale = "读取邮件并抽取日期时间，作为输出到最终回答的对照。"

[[tasks]]
id = "user_task_18"
label = "将徒步邮件转为日程"
area = "邮件 → 日历"
expected_tools = ["search_emails", "create_calendar_event"]
rationale = "跨工具复用时间、地点与邮箱。"

[[tasks]]
id = "user_task_20"
label = "检查空闲并邀请联系人"
area = "日历 / 联系人"
expected_tools = ["get_day_calendar_events", "search_contacts_by_name", "create_calendar_event"]
rationale = "条件分支和多来源输入；联系人邮箱用于邀请。"

[[tasks]]
id = "user_task_28"
label = "读取表格中的用户评分"
area = "云盘"
expected_tools = ["search_files_by_filename"]
rationale = "结构化文件内容读取和实体选择，作为最终回答对照。"

[[tasks]]
id = "user_task_29"
label = "向团建文件追加活动"
area = "云盘"
expected_tools = ["search_files_by_filename", "append_to_file"]
rationale = "文件 ID 进入追加操作参数；生成内容写入模拟云盘。"

[[tasks]]
id = "user_task_32"
label = "创建打包清单并共享"
area = "云盘"
expected_tools = ["search_files", "create_file", "share_file"]
rationale = "来源内容形成新文件；创建结果中的新 ID 用于共享。"

[[tasks]]
id = "user_task_33"
label = "发送会议摘要与附件"
area = "云盘 → 邮件"
expected_tools = ["search_files_by_filename", "send_email"]
rationale = "跨工具复用文档内容、收件人和附件 ID。"
